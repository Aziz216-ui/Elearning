<!DOCTYPE html>
<html>
<head>
    <title>Créer Webhook - Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Créer un Webhook de Test</h1>
        
        <form id="webhookForm">
            <div class="mb-3">
                <label for="url" class="form-label">URL du webhook *</label>
                <input type="url" class="form-control" id="url" name="url" required 
                       placeholder="https://webhook.site/votre-id">
            </div>
            
            <div class="mb-3">
                <label for="eventType" class="form-label">Type d'événement *</label>
                <select class="form-select" id="eventType" name="eventType" required>
                    <option value="quiz_started" selected>Quiz commencé</option>
                    <option value="quiz_completed">Quiz complété</option>
                    <option value="all">Tous les événements</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Créer le webhook</button>
            <a href="http://127.0.0.1:8000/admin/webhooks" class="btn btn-secondary">Retour</a>
        </form>
        
        <div id="result" class="mt-3"></div>
        
        <div class="mt-3">
            <h5>Instructions:</h5>
            <ol>
                <li>Allez sur <a href="https://webhook.site" target="_blank">webhook.site</a></li>
                <li>Copiez l'URL unique qui vous est donnée</li>
                <li>Collez-la dans le champ URL ci-dessus</li>
                <li>Cliquez sur "Créer le webhook"</li>
                <li>Commencez un quiz pour tester la notification</li>
            </ol>
        </div>
    </div>

    <script>
        document.getElementById('webhookForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const url = document.getElementById('url').value;
            const eventType = document.getElementById('eventType').value;
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch('/api/webhooks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        eventType: eventType
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = '<div class="alert alert-success">Webhook créé avec succès! ID: ' + data.data.id + '<br>URL: ' + data.data.url + '<br>Secret: ' + data.data.secret + '</div>';
                } else {
                    resultDiv.innerHTML = '<div class="alert alert-danger">Erreur: ' + data.error + '</div>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<div class="alert alert-danger">Erreur: ' + error.message + '</div>';
            }
        });
    </script>
</body>
</html>
