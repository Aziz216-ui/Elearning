<!DOCTYPE html>
<html>
<head>
    <title>Test API Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test API Notifications</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Test API Unread</h3>
                <button onclick="testUnread()" class="btn btn-primary">Tester /api/notifications/unread</button>
                <pre id="unreadResult" class="mt-3"></pre>
            </div>
            
            <div class="col-md-6">
                <h3>Test API Recent</h3>
                <button onclick="testRecent()" class="btn btn-success">Tester /api/notifications/recent</button>
                <pre id="recentResult" class="mt-3"></pre>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h3>Créer notification test</h3>
                <button onclick="createTestNotification()" class="btn btn-warning">Créer notification test</button>
                <pre id="createResult" class="mt-3"></pre>
            </div>
        </div>
    </div>

    <script>
        function testUnread() {
            fetch('/api/notifications/unread')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('unreadResult').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('unreadResult').textContent = 'ERROR: ' + error.message;
                });
        }
        
        function testRecent() {
            fetch('/api/notifications/recent')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('recentResult').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('recentResult').textContent = 'ERROR: ' + error.message;
                });
        }
        
        function createTestNotification() {
            fetch('/debug/test-notification')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('createResult').textContent = data;
                    // Après création, tester les APIs
                    setTimeout(() => {
                        testUnread();
                        testRecent();
                    }, 500);
                })
                .catch(error => {
                    document.getElementById('createResult').textContent = 'ERROR: ' + error.message;
                });
        }
        
        // Auto-test au chargement
        window.onload = function() {
            testUnread();
            testRecent();
        };
    </script>
</body>
</html>
